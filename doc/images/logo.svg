<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
  </defs>

  <!-- head + hair silhouette, tilted slightly -->
  <g transform="rotate(-6 100 100)">
    <!-- back hair -->
    <path d="M42 120 C30 70 60 36 102 34 C146 32 172 66 164 118 C168 146 156 166 140 170 L62 170 C46 164 38 146 42 120 Z"
          fill="#dfeef8" stroke="#1d2b3d" stroke-width="4" stroke-linejoin="round"/>
    <!-- fringe sweeping over the right eye -->
    <path d="M52 92 C62 56 104 44 132 52 C152 58 162 74 160 96 C150 84 138 80 122 86 C108 90 96 78 84 84 C72 90 60 96 52 92 Z"
          fill="#f4f9fc" stroke="#1d2b3d" stroke-width="4" stroke-linejoin="round"/>
    <!-- face -->
    <path d="M62 96 C62 130 80 150 100 150 C122 150 140 130 140 96 Z" fill="#f4f9fc"/>

    <!-- lenses -->
    <circle cx="82" cy="108" r="22" fill="#ffffff" fill-opacity="0.15" stroke="#1d2b3d" stroke-width="4.5"/>
    <circle cx="122" cy="108" r="22" fill="#ffffff" fill-opacity="0.15" stroke="#1d2b3d" stroke-width="4.5"/>
    <path d="M104 106 Q102 102 100 106" fill="none" stroke="#1d2b3d" stroke-width="3"/>
    <path d="M60 104 Q52 100 46 106" fill="none" stroke="#1d2b3d" stroke-width="3.5"/>
    <path d="M144 104 Q152 100 158 106" fill="none" stroke="#1d2b3d" stroke-width="3.5"/>

    <!-- heavy-lidded eyes: pupils sit low under a lid line -->
    <path d="M66 100 Q82 92 98 100" fill="none" stroke="#1d2b3d" stroke-width="3" stroke-linecap="round"/>
    <path d="M106 100 Q122 92 138 100" fill="none" stroke="#1d2b3d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="84" cy="110" r="9" fill="#1d2b3d"/>
    <circle cx="120" cy="110" r="9" fill="#1d2b3d"/>
    <circle cx="82" cy="107" r="2.5" fill="#ffffff"/>
    <circle cx="118" cy="107" r="2.5" fill="#ffffff"/>

    <!-- glow accent on the rims, in place of the arrows -->
    <circle cx="82" cy="108" r="22" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="122" cy="108" r="22" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.9"/>
  </g>
</svg>
